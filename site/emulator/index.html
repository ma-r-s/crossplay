<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Crossplay, running</title>
<!-- The build is threaded, so SharedArrayBuffer has to be available, which means
     the response needs COOP/COEP. site/vercel.json sets both on every path.
     A host that will not send them leaves this page with a plain message rather
     than a blank canvas; see the crossOriginIsolated check below. -->
<style>
  :root { color-scheme: light dark; --paper:#faf9f6; --ink:#111110; --edge:#c9c6bd; }
  @media (prefers-color-scheme: dark) { :root { --paper:#111110; --ink:#faf9f6; --edge:#3a3833; } }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:var(--paper); color:var(--ink);
               font:400 15px/1.5 ui-sans-serif, system-ui, -apple-system, sans-serif; }
  #stage { min-height:100%; display:flex; flex-direction:column; align-items:center;
           justify-content:center; gap:14px; padding:16px; }
  /* The panel keeps its own aspect and never scrolls the page sideways; the
     firmware flips it to landscape for Solitaire and the comic reader, so the
     box has to follow rather than assume portrait. */
  #panel { position:relative; background:#faf9f6; border:1px solid var(--edge);
           border-radius:6px; overflow:hidden; box-shadow:0 12px 40px rgba(0,0,0,.14);
           touch-action:none; }
  canvas { display:block; width:100%; height:100%; }
  #keys { display:flex; gap:8px; flex-wrap:wrap; justify-content:center; }
  button.key { font:inherit; font-size:13px; letter-spacing:.06em; text-transform:uppercase;
               background:transparent; color:var(--ink); border:1px solid var(--edge);
               border-radius:4px; padding:7px 13px; cursor:pointer; -webkit-tap-highlight-color:transparent; }
  button.key:active { background:var(--ink); color:var(--paper); }
  #hint { font-size:13px; opacity:.62; text-align:center; max-width:34em; }
  #boot { position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
          background:var(--paper); font-size:13px; letter-spacing:.08em; text-transform:uppercase; }
  #boot.hidden { display:none; }
  #boot .err { text-transform:none; letter-spacing:0; padding:20px; text-align:center;
               line-height:1.6; max-width:32em; }
</style>
</head>
<body>
<div id="stage">
  <div id="panel"><canvas id="fb"></canvas><div id="boot">Starting the device</div></div>
  <div id="keys">
    <button class="key" data-sc="41">Back</button>
    <button class="key" data-sc="40">OK</button>
    <button class="key" data-sc="82">Up</button>
    <button class="key" data-sc="81">Down</button>
    <button class="key" data-sc="80">Left</button>
    <button class="key" data-sc="79">Right</button>
  </div>
  <p id="hint">Tap the screen. This is the real firmware, compiled for your browser, with an SD card of its own.</p>
</div>

<script>
(function () {
  // The panel is natively landscape; the firmware rotates its output to suit
  // the app, and tells us the angle. Everything below is driven by that one
  // number so no orientation is special-cased twice.
  var PANEL_W = 800, PANEL_H = 480;

  var panel = document.getElementById('panel');
  var canvas = document.getElementById('fb');
  var ctx = canvas.getContext('2d');
  var boot = document.getElementById('boot');

  // Native-resolution staging frame. The firmware's ordered dither is a real
  // 1-bit pattern, so it wants to be drawn at 1:1 and then scaled with
  // smoothing on -- that is what averages a 2x2 dither cell into flat gray, the
  // same thing the 220ppi panel does with your eye.
  var off = document.createElement('canvas');
  off.width = PANEL_W; off.height = PANEL_H;
  var offCtx = off.getContext('2d');
  var image = offCtx.createImageData(PANEL_W, PANEL_H);
  var rgba = image.data;

  var logicalW = PANEL_H, logicalH = PANEL_W;   // portrait until told otherwise
  var rotation = -1;

  function fail(message) {
    boot.classList.remove('hidden');
    var div = document.createElement('div');
    div.className = 'err';
    div.textContent = message;
    boot.replaceChildren(div);
  }

  // Size the panel box to the logical screen, bounded by the viewport, and give
  // the canvas a backing store at device-pixel size so the scale-up stays sharp.
  function layout() {
    var maxH = Math.max(320, window.innerHeight - 150);
    var maxW = Math.min(window.innerWidth - 32, 520);
    var scale = Math.min(maxW / logicalW, maxH / logicalH);
    panel.style.width = Math.round(logicalW * scale) + 'px';
    panel.style.height = Math.round(logicalH * scale) + 'px';
    var dpr = window.devicePixelRatio || 1;
    canvas.width = Math.round(logicalW * scale * dpr);
    canvas.height = Math.round(logicalH * scale * dpr);
    ctx.imageSmoothingEnabled = true;
    ctx.imageSmoothingQuality = 'high';
  }
  window.addEventListener('resize', layout);

  function applyRotation(deg) {
    if (deg === rotation) return;
    rotation = deg;
    var portrait = deg === 90 || deg === 270;
    logicalW = portrait ? PANEL_H : PANEL_W;
    logicalH = portrait ? PANEL_W : PANEL_H;
    // Published because the canvas backing store is in device pixels and the
    // firmware's coordinates are not. Anything scripting this page has to know
    // the logical size to aim a tap, and an app that flips to landscape changes
    // it mid-session.
    window.crossplayPanel = { width: logicalW, height: logicalH, rotation: deg };
    layout();
  }

  var Module = null, framePtr = 0;
  var consumeDirty, frameRotation, injectTouch, injectKey;

  function paint() {
    // HEAPU32 is replaced whenever wasm memory grows, so re-read it per frame.
    var heap = Module.HEAPU32;
    var base = framePtr >> 2;
    // ARGB in the firmware's buffer, RGBA in ImageData, and the frame is
    // opaque, so only the channel order has to change.
    for (var i = 0, n = PANEL_W * PANEL_H; i < n; i++) {
      var argb = heap[base + i];
      var o = i << 2;
      rgba[o] = (argb >> 16) & 0xff;
      rgba[o + 1] = (argb >> 8) & 0xff;
      rgba[o + 2] = argb & 0xff;
      rgba[o + 3] = 0xff;
    }
    offCtx.putImageData(image, 0, 0);

    applyRotation(frameRotation());
    var scale = canvas.width / logicalW;
    ctx.save();
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    // Rotate about the centre of the canvas and draw the landscape frame
    // centred on it, which is exactly what HalDisplay asks SDL to do.
    ctx.translate(canvas.width / 2, canvas.height / 2);
    ctx.rotate(rotation * Math.PI / 180);
    ctx.scale(scale, scale);
    ctx.drawImage(off, -PANEL_W / 2, -PANEL_H / 2);
    ctx.restore();
  }

  function frame() {
    if (consumeDirty && consumeDirty()) paint();
    requestAnimationFrame(frame);
  }

  // ---- input ---------------------------------------------------------------
  // Coordinates go in as logical screen pixels: the same space GfxRenderer draws
  // in, so the firmware never learns there was a canvas. The simulator's X4 Pro
  // touch emulation turns down/move/up into taps, holds and swipes on its own.
  function toPanel(event) {
    var r = canvas.getBoundingClientRect();
    return [
      Math.round((event.clientX - r.left) / r.width * (logicalW - 1)),
      Math.round((event.clientY - r.top) / r.height * (logicalH - 1)),
    ];
  }

  var tracking = false;
  canvas.addEventListener('pointerdown', function (e) {
    if (!injectTouch) return;
    e.preventDefault();
    canvas.setPointerCapture(e.pointerId);
    tracking = true;
    var p = toPanel(e);
    injectTouch(0, p[0], p[1]);
  });
  canvas.addEventListener('pointermove', function (e) {
    if (!tracking || !injectTouch) return;
    var p = toPanel(e);
    injectTouch(1, p[0], p[1]);
  });
  function release(e) {
    if (!tracking || !injectTouch) return;
    tracking = false;
    var p = toPanel(e);
    injectTouch(2, p[0], p[1]);
  }
  canvas.addEventListener('pointerup', release);
  canvas.addEventListener('pointercancel', release);

  var KEYS = { Escape: 41, Enter: 40, NumpadEnter: 40, ArrowRight: 79, ArrowLeft: 80,
               ArrowDown: 81, ArrowUp: 82, Backspace: 41 };
  window.addEventListener('keydown', function (e) {
    var sc = KEYS[e.code] || KEYS[e.key];
    if (!sc || !injectKey) return;
    e.preventDefault();
    if (e.repeat) return;   // HalGPIO is edge-triggered
    injectKey(sc, 1);
  });
  window.addEventListener('keyup', function (e) {
    var sc = KEYS[e.code] || KEYS[e.key];
    if (!sc || !injectKey) return;
    e.preventDefault();
    injectKey(sc, 0);
  });

  document.querySelectorAll('button.key').forEach(function (b) {
    var sc = Number(b.dataset.sc);
    b.addEventListener('pointerdown', function (e) { e.preventDefault(); if (injectKey) injectKey(sc, 1); });
    var up = function (e) { e.preventDefault(); if (injectKey) injectKey(sc, 0); };
    b.addEventListener('pointerup', up);
    b.addEventListener('pointerleave', up);
    b.addEventListener('pointercancel', up);
  });

  // ---- boot ----------------------------------------------------------------
  layout();

  if (!self.crossOriginIsolated) {
    fail('This page needs cross-origin isolation (COOP/COEP) before the threaded ' +
         'build can start. If it was just installed, reloading once is enough.');
    return;
  }

  var script = document.createElement('script');
  script.src = 'crossplay.js';
  script.onerror = function () { fail('Could not load crossplay.js'); };
  script.onload = function () {
    createCrossplay({
      print: function (t) { console.log('[sim]', t); },
      printErr: function (t) { console.warn('[sim]', t); },
    }).then(function (mod) {
      Module = mod;
      framePtr = mod.cwrap('crossplay_frame_ptr', 'number', [])();
      consumeDirty = mod.cwrap('crossplay_consume_dirty', 'number', []);
      frameRotation = mod.cwrap('crossplay_frame_rotation', 'number', []);
      injectTouch = mod.cwrap('crossplay_touch', null, ['number', 'number', 'number']);
      injectKey = mod.cwrap('crossplay_key', null, ['number', 'number']);
      boot.classList.add('hidden');
      requestAnimationFrame(frame);
    }).catch(function (e) { fail('The device did not start: ' + e); });
  };
  document.body.appendChild(script);
})();
</script>
</body>
</html>
