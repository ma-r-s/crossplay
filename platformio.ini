[platformio]
default_envs = default
build_cache_dir = .cache
extra_configs = platformio.sim.ini

[crosspoint]
version = 1.6.0

; The fork's own version, and it has to be separate from upstream's.
;
; OtaUpdater compares the release's tag_name against CROSSPOINT_VERSION as
; three semver segments. Releasing under upstream's 1.5.0 while tagging
; anything higher would mean the device offered the same update forever,
; because installing it would never change the version it compares against.
[crossplay]
version = 1.12.21

[base]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.37/platform-espressif32.zip
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
check_tool = cppcheck
; missingInclude (project headers) is suppressed alongside missingIncludeSystem: on a
; fresh CI checkout cppcheck has no resolved include paths, so it reports every
; project header as missing (~400 information-level lines) and fails the job.
check_flags = --enable=all --suppress=missingIncludeSystem --suppress=missingInclude --suppress=unusedFunction --suppress=unmatchedSuppression --suppress=*:*/.pio/* --inline-suppr
check_skip_packages = yes

board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_upload.offset_address = 0x10000

build_flags =
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DEINK_DISPLAY_SINGLE_BUFFER_MODE=1
  -DDISABLE_FS_H_WARNING=1
  -DDESTRUCTOR_CLOSES_FILE=1
# https://libexpat.github.io/doc/api/latest/#XML_GE
  -DXML_GE=0
  -DXML_CONTEXT_BYTES=1024
  -std=gnu++2a
# Enable UTF-8 long file names in SdFat
  -DUSE_UTF8_LONG_NAMES=1
# Increase PNG scanline buffer to support up to 2048px wide images
# Default is (320*4+1)*2=2562, we need more for larger images
  -DPNG_MAX_BUFFERED_PIXELS=16416
  -DFREEINK_NET_WOLFSSL=1
  -DWOLFSSL_USER_SETTINGS
  -DWOLFSSL_OPTIONS_H
  -DWOLFSSL_CLIENT_EXAMPLE
  -DWOLFSSL_TLS13
# MEMFIX-PORT: single-precision ECC (sp_c32.c). Without it every P-256 operation
# (TLS 1.3 key_share keygen, ECDHE, ECDSA cert verify) runs on fast-math bignums
# that WOLFSSL_SMALL_STACK heap-allocates at FP_MAX_BITS size -- tens of KB of
# temporaries, which OOMs (MP_MEM) at the ~50KB free heap a reading session
# leaves. SP uses fixed 256-bit arrays: a few KB, and several times faster.
# SP_SMALL trades the large precomputed point tables for smaller flash.
  ; Browsers accept a chain the moment an intermediate meets a trusted
  ; root; stock wolfSSL instead walks the PRESENTED chain to its very end
  ; and demands a signer for the final cert -- and Cloudflare ends its
  ; chain with GTS Root R4 cross-signed by GlobalSign, so verification
  ; failed (-188) with the genuine GTS root sitting in the store. This
  ; flag is wolfSSL's switch for the browser behavior.
  -DWOLFSSL_ALT_CERT_CHAINS
  ; Modern CA signatures (Google Trust's WE1, Let's Encrypt's E-series)
  ; are ECDSA over SHA-384; without these the verify path dies with
  ; HASH_TYPE_E (-232). The handshake never needed them because every
  ; caller before the sync bridge skipped verification entirely.
  -DWOLFSSL_SHA384
  -DWOLFSSL_SHA512
  -DWOLFSSL_HAVE_SP_ECC
  -DWOLFSSL_SP_SMALL
# Arduino-wolfSSL's user_settings.h enables TLS extensions, supported curves,
# HKDF, and RSA-PSS when WOLFSSL_TLS13 is set. Do not repeat those defines here:
# GCC reports every library translation unit as a macro redefinition.
  -DHAVE_FFDHE_2048
  -DHAVE_CURVE25519
  -DHAVE_SNI
  -Wno-bidi-chars
  -Wl,--wrap=panic_print_backtrace,--wrap=panic_abort,--wrap=bootloader_common_check_efuse_blk_validity
  -fno-exceptions

build_unflags =
  -std=gnu++11
  -fexceptions

; Board configuration
board_build.flash_mode = dio
board_build.flash_size = 16MB
board_build.partitions = partitions.csv

extra_scripts =
  ; Refuses a device build that would race another tree's. Only in
  ; platformio.ini, never platformio.sim.ini: the simulator build touches
  ; neither ~/.platformio nor the shared ComponentManager cache, and
  ; serialising it would slow the loop everybody actually waits on.
  ; FIRST, so a build that must not happen is refused before anything else
  ; does work -- including the sconsign shard below it.
  pre:scripts_local/require_build_lock.py
  ; A shared BUILD_CACHE_DIR otherwise shares SCons's signature database too,
  ; and any two builds finishing together race on it.
  pre:scripts_local/sconsign_per_tree.py
  pre:scripts/patch_pioarduino_cache.py
  pre:scripts/patch_wolfssl.py
  pre:scripts/build_html.py
  pre:scripts/gen_i18n.py
  pre:scripts/git_branch.py
  pre:scripts/patch_jpegdec.py
  post:scripts/register_unit_tests_target.py

; Libraries
lib_deps =
  BatteryMonitor=symlink://freeink-sdk/libs/hardware/BatteryMonitor
  InputManager=symlink://freeink-sdk/libs/hardware/InputManager
  EInkDisplay=symlink://freeink-sdk/libs/display/FreeInkDisplay
  SDCardManager=symlink://freeink-sdk/libs/hardware/SDCardManager
  UsbMassStorage=symlink://freeink-sdk/libs/hardware/UsbMassStorage
  BoardConfig=symlink://freeink-sdk/libs/hardware/BoardConfig
  XteinkDetect=symlink://freeink-sdk/libs/hardware/XteinkDetect
  PowerManager=symlink://freeink-sdk/libs/hardware/PowerManager
  FrontlightManager=symlink://freeink-sdk/libs/hardware/FrontlightManager
  Rtc=symlink://freeink-sdk/libs/hardware/Rtc
  Imu=symlink://freeink-sdk/libs/hardware/Imu
  SecureNet=symlink://freeink-sdk/libs/network/SecureNet
  FreeInkUI=symlink://freeink-sdk/libs/ui/FreeInkUI
  Icons=symlink://freeink-sdk/libs/assets/Icons
  bblanchon/ArduinoJson @ 7.4.2
  ricmoo/QRCode @ 0.0.1
  bitbank2/PNGdec @ 1.1.6
  https://github.com/bitbank2/JPEGDEC.git#86282979224c8a32fd51e091ed5a35b0c699a52b
  links2004/WebSockets @ 2.7.3
  wolfssl/Arduino-wolfSSL @ 5.7.2

lib_ignore =
  BLE

; The standard firmware profiles reclaim heap by rebuilding the Arduino core.
; USB-OTG (FREEINK_CAP_USB_MSC) profiles like the X4 Pro and Paper Mono
; intentionally do not inherit this section: they need PioArduino's complete
; prebuilt TinyUSB component graph, which the custom core rebuild omits.
[firmware_tuned]
; MEMFIX-PORT: custom_sdkconfig heap reclamation (~32-37 KB). Rebuilds the
; Arduino core libs on first build (slower once, cached after; needs the CMake
; pin in platformio.local.ini on macOS).
;
; If an interrupted rebuild fails with "multiple definition of 'app_main'"
; (stale generated scaffold), clean it up with:
;   rm -rf .dummy CMakeLists.txt sdkconfig.default sdkconfig.defaults .pio/build/default
; Do NOT use `git clean -fdX` — it deletes platformio.local.ini.
custom_sdkconfig =
  ; Task stack right-sizing from measured high-water marks (heap block map +
  ; per-task stack audit, July 2026): esp_timer used ~0.8 KB of 8 KB across
  ; every capture; the FreeRTOS timer service used ~0.5 KB
  ; of 4 KB. Neither runs TLS or app code. ~7 KB back to the heap.
  CONFIG_ESP_TIMER_TASK_STACK_SIZE=4096
  CONFIG_FREERTOS_TIMER_TASK_STACK_DEPTH=2560
  ; Move the WiFi stack's non-critical hot paths out of IRAM into flash.
  ; On the C3, IRAM and DRAM share one SRAM pool, so the ~25-30 KB this
  ; frees lands directly in the heap — paid for with lower WiFi throughput
  ; during transfers (occasional sync/OTA use, not streaming: acceptable).
  ; IRAM cost is static, so the heap gain applies even with WiFi off.
  CONFIG_ESP_WIFI_IRAM_OPT=n
  CONFIG_ESP_WIFI_RX_IRAM_OPT=n
  ; Keep the Arduino wrappers for the removed cloud components (below) out of
  ; the core source list; all other bundled libraries default to enabled.
  CONFIG_ARDUINO_SELECTIVE_COMPILATION=y
  CONFIG_ARDUINO_SELECTIVE_RainMaker=n
  CONFIG_ARDUINO_SELECTIVE_Insights=n
  ; ESP_SR (speech recognition) only exists in the S3 core; its wrapper includes
  ; ESP_I2S.h, which the isolated core rebuild can't resolve. Unused here anyway,
  ; so drop it or the sticky env fails to build.
  CONFIG_ARDUINO_SELECTIVE_ESP_SR=n

; Drop unused cloud components from the core rebuild. esp_insights/rainmaker
; require embedded server certs the lib builder can't generate
; ("https_server.crt.S not found"); this firmware uses none of them.
custom_component_remove =
  espressif/esp_insights
  espressif/esp_rainmaker
  espressif/esp_diagnostics
  espressif/esp_diag_data_store
  espressif/esp_schedule
  espressif/esp_rcp_update
  espressif/esp_secure_cert_mgr
  espressif/cbor

[env:default]
extends = base, firmware_tuned
build_flags =
  ${base.build_flags}
  ; CROSSPOINT_VERSION is set by scripts/git_branch.py (includes branch + short SHA)
  -DFREEINK_DEVICE_X4=1
  -DFREEINK_DEVICE_X3=1
  -DENABLE_SERIAL_LOG
  -DCROSSPOINT_WAIT_FOR_USB_SERIAL
  -DLOG_LEVEL=2 ; Set log level to debug for development builds


[env:gh_release]
extends = base, firmware_tuned
build_flags =
  ${base.build_flags}
  -DFREEINK_DEVICE_X4=1
  -DFREEINK_DEVICE_X3=1
  -DCROSSPOINT_VERSION=\"${crosspoint.version}\"
  -DENABLE_SERIAL_LOG
  -DLOG_LEVEL=1 ; Set log level to info for release builds

[env:gh_release_rc]
extends = base, firmware_tuned
build_flags =
  ${base.build_flags}
  -DFREEINK_DEVICE_X4=1
  -DFREEINK_DEVICE_X3=1
  -DCROSSPOINT_VERSION=\"${crosspoint.version}-rc+${sysenv.CROSSPOINT_RC_HASH}\"
  -DENABLE_SERIAL_LOG
  -DLOG_LEVEL=1 ; Set log level to info for release candidate builds

[env:slim]
extends = base, firmware_tuned
build_flags =
  ${base.build_flags}
  -DFREEINK_DEVICE_X4=1
  -DFREEINK_DEVICE_X3=1
  -DCROSSPOINT_VERSION=\"${crosspoint.version}-slim\"
  ; serial output is disabled in slim builds to save space
  -UENABLE_SERIAL_LOG

; --- Seeed Sticky — ESP32-S3R8, 3.97" 800x480 SSD1677 + GT911 touch -----------
; Same MCU, panel, resolution, touch controller and uiScale as the X4 Pro; the
; SDK auto-enables CAP_TOUCH (GT911), the BQ27220 gauge, mic, buzzer and the
; on-board sensors for this device. Three buttons (up GPIO5, down GPIO6, a
; shared confirm/power GPIO4), no frontlight, SD over SPI (no
; USE_BLOCK_DEVICE_INTERFACE — that flag is for the SDMMC boards).
;
; FORK CHANGE: upstream 1.5.0 ships [env:sticky] plus sticky-gh_release{,_rc}.
; This fork keeps its x4pro_common arrangement for the same reasons as x4pro:
; the render-task stack is load-bearing for the FreeInkUI screens, and two
; release envs for one device is a footgun. The release env pins the fork's
; own version (crossplay.version), because OtaUpdater compares against it.
;   pio run -e sticky -t upload
[sticky_common]
extends = base
board = esp32-s3-devkitc1-n16r8
board_build.mcu = esp32s3
build_flags =
  ${base.build_flags}
  -DFREEINK_DEVICE_STICKY=1
  ; FORK CHANGE: upstream's sticky env says "PSRAM intentionally left off",
  ; but the board is an S3R8 (esptool: Embedded PSRAM 8MB) and the pioarduino
  ; core for esp32-s3-devkitc1-n16r8 initializes the octal PSRAM pool no
  ; matter what (verified on the desk unit: ESP.getPsramSize()=8MB with the
  ; flag absent). The define must match that reality: HalPowerManager keys its
  ; idle CPU floor on it (80MHz with PSRAM, 10MHz without), and 10MHz under
  ; live octal PSRAM is the wrong side of that line. Also puts the eighteen
  ; apps on the same memory model as the X4 Pro they were built against.
  -DBOARD_HAS_PSRAM
  ; Same value as x4pro_common, and keep them identical: the two devices run
  ; the same screens through the same renderer, and stack_budget.py reads the
  ; first -DCROSSPOINT_RENDER_TASK_STACK match in this file for both builds.
  -DCROSSPOINT_RENDER_TASK_STACK=16384
  -DENABLE_SERIAL_LOG

[env:sticky]
extends = sticky_common
build_flags =
  ${sticky_common.build_flags}
  -DCROSSPOINT_VERSION=\"${crosspoint.version}-sticky\"
  -DLOG_LEVEL=2
  ; Host-driven taps/buttons/screenshots over the board's serial transport
  ; (lib/DevInput, src/DevSerialBridge*, tools_local/device/drive.py).
  ; Dev builds only; never in a release env.
  -DCROSSPOINT_DEV_SERIAL_BRIDGE=1

; What a tag builds for the Sticky, alongside gh_release_x4pro. Identical to
; sticky except the log level; see gh_release_x4pro for why the fork's release
; envs exist at all.
[env:gh_release_sticky]
extends = sticky_common
build_flags =
  ${sticky_common.build_flags}
  -DCROSSPOINT_VERSION=\"${crossplay.version}\"
  -DLOG_LEVEL=1

; --- Xteink X4 Pro — ESP32-S3, 16MB flash / 8MB PSRAM, SSD1677 + GT911 --------
; Same panel/driver family as the X4 but an S3 with capacitive touch and a dual
; warm/cold color-temperature frontlight. The SDK auto-enables CAP_TOUCH and
; CAP_FRONTLIGHT for this device.
;   pio run -e x4pro -t upload
; Everything the X4 Pro needs except the two flags that differ between a
; development build and a release. Those are added by each env below rather
; than inherited and then overridden: build_unflags does not reach the ESP-IDF
; component builds, so an inherited -D survived beside the new one and every
; wpa_supplicant translation unit failed on "CROSSPOINT_VERSION redefined"
; under -Werror. Defining each exactly once is the only arrangement with no
; duplicate to remove.
;
; FORK CHANGE: upstream 1.6.0rc ships its own [env:x4pro] plus
; x4pro-gh_release{,_rc}. This fork keeps its x4pro_common arrangement instead:
; the render-task stack below is load-bearing for the FreeInkUI screens
; (upstream's default 8192 is what crashed v1.0.0), and two release envs for
; one device is a footgun. Upstream's FREEINK_FRONTLIGHT_LS is adopted.
[x4pro_common]
extends = base
board = esp32-s3-devkitc1-n16r8
board_build.mcu = esp32s3
board_build.arduino.memory_type = dio_opi
; Use the prebuilt dio_opi Arduino variant: its TinyUSB component is enabled
; for CDC and MSC. This profile deliberately extends base rather than
; firmware_tuned, whose custom SDK rebuild omits that component.
build_flags =
  ${base.build_flags}
  -DFREEINK_DEVICE_X4PRO=1
  -DFREEINK_CAP_USB_MSC=1
  -DBOARD_HAS_PSRAM
  ; The render task's stack. Upstream's 8192 is a C3 number; this is an S3 with
  ; 8MB of PSRAM, and this fork's screens draw through FreeInkUI, whose deepest
  ; path needs more than 8192. That is what crashed v1.0.0 on the first device
  ; that ran it. Verified against the real worst path by
  ; scripts_local/stack_budget.py, which fails CI if this stops being enough.
  -DCROSSPOINT_RENDER_TASK_STACK=16384
  -DENABLE_SERIAL_LOG
  ; X4 Pro SD is native SDMMC (1-bit): SdFat mounts an FsVolume on the esp-idf
  ; SDMMC block device, which needs SdFat's generic block-device interface.
  -DUSE_BLOCK_DEVICE_INTERFACE=1
  ; Frontlight PWM clocked from RC_FAST with KEEP_ALIVE so it survives light
  ; sleep (freeink-sdk FREEINK_FRONTLIGHT_LS); pairs with the HalPowerManager
  ; change that stops a lit frontlight from blocking sleep. (upstream 1.6.0rc)
  -DFREEINK_FRONTLIGHT_LS

[env:x4pro]
extends = x4pro_common
build_flags =
  ${x4pro_common.build_flags}
  -DCROSSPOINT_VERSION=\"${crosspoint.version}-x4pro\"
  -DLOG_LEVEL=2
  ; Host-driven taps/buttons/screenshots over the board's serial transport
  ; (lib/DevInput, src/DevSerialBridge*, tools_local/device/drive.py).
  ; Dev builds only; never in a release env.
  -DCROSSPOINT_DEV_SERIAL_BRIDGE=1

; What a tag builds. Identical to x4pro except the log level, because a release
; that differs from the tree you debugged is a release you cannot debug.
;
; This exists because upstream's gh_release is -DFREEINK_DEVICE_X4/X3, which is
; ESP32-C3. Shipping that as this fork's release would hand every updater a
; binary for the wrong chip.
[env:gh_release_x4pro]
extends = x4pro_common
build_flags =
  ${x4pro_common.build_flags}
  -DCROSSPOINT_VERSION=\"${crossplay.version}\"
  -DLOG_LEVEL=1

; --- M5Stack Paper Mono — ESP32-S3, SSD1683 800x480 + FT6336 touch + frontlight
; Power/reset plumbing runs through the M5PM1 PMIC and M5IOE1 expander; the SDK
; sequences them itself. Touch, frontlight, RTC, and other capabilities are
; selected by the Paper Mono BoardConfig profile.
; Extends base (not firmware_tuned): USB Drive needs the prebuilt dio_opi
; Arduino variant, whose TinyUSB component is enabled for CDC and MSC.
;   pio run -e papermono -t upload
[env:papermono]
extends = base
board = esp32-s3-devkitc1-n16r8
board_build.mcu = esp32s3
board_build.arduino.memory_type = dio_opi
build_flags =
  ${base.build_flags}
  -DFREEINK_DEVICE_PAPERMONO=1
  -DFREEINK_CAP_USB_MSC=1
  ; The SSD1683 grayscale target planes are batched in PSRAM.
  -DBOARD_HAS_PSRAM
  -DUSB_PRODUCT=\"CrossPoint_Paper_Mono\"
  -DUSB_MANUFACTURER=\"CrossPoint\"
  -DCROSSPOINT_VERSION=\"${crosspoint.version}-papermono\"
  -DENABLE_SERIAL_LOG
  -DCROSSPOINT_WAIT_FOR_USB_SERIAL
  -DLOG_LEVEL=2
  ; Native 1-bit SDMMC is mounted through SdFat's block-device interface.
  -DUSE_BLOCK_DEVICE_INTERFACE=1

[env:papermono-gh_release]
extends = base
board = esp32-s3-devkitc1-n16r8
board_build.mcu = esp32s3
board_build.arduino.memory_type = dio_opi
build_flags =
  ${base.build_flags}
  -DFREEINK_DEVICE_PAPERMONO=1
  -DFREEINK_CAP_USB_MSC=1
  -DBOARD_HAS_PSRAM
  -DUSB_PRODUCT=\"CrossPoint_Paper_Mono\"
  -DUSB_MANUFACTURER=\"CrossPoint\"
  -DCROSSPOINT_VERSION=\"${crosspoint.version}\"
  -DENABLE_SERIAL_LOG
  -DLOG_LEVEL=1 ; Set log level to info for release builds
  -DUSE_BLOCK_DEVICE_INTERFACE=1

[env:papermono-gh_release_rc]
extends = base
board = esp32-s3-devkitc1-n16r8
board_build.mcu = esp32s3
board_build.arduino.memory_type = dio_opi
build_flags =
  ${base.build_flags}
  -DFREEINK_DEVICE_PAPERMONO=1
  -DFREEINK_CAP_USB_MSC=1
  -DBOARD_HAS_PSRAM
  -DUSB_PRODUCT=\"CrossPoint_Paper_Mono\"
  -DUSB_MANUFACTURER=\"CrossPoint\"
  -DCROSSPOINT_VERSION=\"${crosspoint.version}-rc+${sysenv.CROSSPOINT_RC_HASH}\"
  -DENABLE_SERIAL_LOG
  -DLOG_LEVEL=1 ; Set log level to info for release candidate builds
  -DUSE_BLOCK_DEVICE_INTERFACE=1
