# CrossPlay's nightly audit. It is not on anybody's path to anything.
#
# WHAT THIS USED TO BE, and why it stopped. Until 2026-09-21 this ran on every
# pull request and every push to xteink, and crossplay-autorelease.yml fired
# on its completion, tagged, and pushed a version-bump commit that started it
# AGAIN. Measured over 400 runs and 54 merged pull requests: one change was
# compiled four times from cold, about 4,955 runner-minutes, 92 per merged
# pull request, and forty minutes between a merge and the assets existing.
#
# None of the four was new work. scripts_local/check.sh --committed already
# clones the committed tree detached into TMPDIR, inits submodules, and builds
# gh_release_x4pro and gh_release_sticky against a warm object cache -- the
# exact two envs crossplay-release.yml then rebuilt. On Mario's Mac that pair
# takes 113 seconds; the `Build everything` step here took 867. Landing and
# publishing now happen there, in scripts_local/ship.sh, and the guard hook
# refuses any other way.
#
# WHAT IT IS FOR NOW. Exactly one thing the local gate cannot do: prove that
# xteink builds and passes on a machine that is not Mario's, from a clean
# checkout, with nothing of his installed. That is worth knowing and it is
# never worth waiting for, so it runs at night and blocks nothing.
#
# Of 36 failures in the 13 days before the change, 23 were the Host tests step
# and 5 were `Build everything` (4 of them one upstream-sync branch retried).
# The compile that cost 20 minutes on every run caught two distinct problems
# in two weeks, and the local gate builds the same envs. That is the whole
# argument for moving it here.
#
# NO push OR pull_request TRIGGER, and that is the point rather than an
# oversight. Adding one back restores the duplicate-build pipeline this
# replaced; host-tests/ci asserts the triggers stay as they are.
name: CrossPlay

on:
  schedule:
    # 09:00 UTC, which is the early hours in Mario's day and well clear of a
    # working evening. Nothing reads the result in a hurry.
    - cron: '0 9 * * *'
  workflow_dispatch:

permissions:
  contents: read

# One nightly run, and nothing to supersede it.
#
# This group used to carry a long expression and a longer comment, because on
# this workflow's old push/pull_request triggers concurrency was load-bearing
# and every simple version of it lost runs. That whole class of problem is
# gone with the triggers, but the lesson is not obvious and is worth keeping,
# because the next person to add a concurrency group anywhere here will reach
# for cancel-in-progress and read it wrong:
#
#   A concurrency group holds at most ONE run in progress and ONE run pending.
#   cancel-in-progress governs only the first. NOTHING governs the second:
#   when a third run arrives GitHub cancels whatever was pending to make room,
#   whether cancel-in-progress is true or false. Measured 2026-09-05 over 36
#   hours: 41 runs of this workflow on xteink were cancelled and
#   `actions/runs/<id>/jobs` returned total_count 0 for every one of them.
#   Not one had started a job. Queueing did not fix it because queueing was
#   never what it did.
#
# A nightly cron and a hand dispatch cannot collide the way merges did, so the
# group is just the workflow and a second dispatch waits rather than killing
# the first.
concurrency:
  group: crossplay-nightly
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # MEASURED, not guessed: this job took 19, 20, 20 and 19 minutes on runs
    # 33951055693, 33950407386, 33949430216 and 33948549676 -- four
    # cross-compiles, the simulator and every host suite. Without a cap it
    # inherits GitHub's SIX HOUR default, so a step that hangs (a fetch that
    # retries forever, a build waiting on a lock) holds the runner for a quarter
    # of a day while the merge that started it reads as still running, which is
    # the same display as a build that is merely slow.
    #
    # 60 is three times the observed run, deliberately: this is the number that
    # says "stuck", not a budget anyone should tune against. Raise it rather
    # than let it start failing honest builds.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          # Tags, or host-tests/release cannot compare this release's notes
          # against what the previous tag published -- it SKIPS instead, which
          # is exactly the check silently not running in the only place that
          # would have caught v1.6.2 shipping v1.6.1's text.
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      - name: Install PlatformIO Core
        run: uv pip install --system -U https://github.com/pioarduino/platformio-core/archive/refs/tags/v6.1.19.zip

      - name: Cache PlatformIO packages
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}

      # The simulator links against SDL2, and on Linux its MD5Builder is a thin
      # wrapper over OpenSSL (CommonCrypto on macOS). The firmware needs
      # neither. Both are usually present on the runner; naming them here is
      # what stops a runner image change from looking like our bug.
      - name: Install the simulator's host libraries
        run: sudo apt-get update && sudo apt-get install -y libsdl2-dev libssl-dev

      # ONE BUILD STEP. Five envs in five invocations became three in one.
      #
      # CI used to build x4pro and sticky (dev) as well. Their only extra code
      # is CROSSPOINT_DEV_SERIAL_BRIDGE, and a break in it costs the next
      # person who wants to drive a device over the cable -- never a user. That
      # is a real cost but a deferred one, and it is not worth paying on every
      # pull request when a plain local check.sh still builds both.
      #
      # ONE invocation for all three, and that is not an optimisation. `pio run`
      # calls clean_build_dir() once per INVOCATION against the whole
      # .pio/build root, and wipes it when compute_project_checksum() differs.
      # This project's pre-scripts write gitignored headers into src/ and lib/
      # as the build runs, so on a fresh checkout invocation #2 opens by
      # deleting invocation #1's output. That is what broke v1.12.14 and
      # v1.12.15. One invocation, one checksum, nothing to delete.
      #
      # The flags only add .su and .ci files beside the objects; they change no
      # code, so this is still the build the checks below read. Measuring the
      # RELEASE images rather than the dev ones is also strictly better: it is
      # the stack of the binary a user actually runs.
      - name: Build everything
        run: PLATFORMIO_BUILD_FLAGS="-fstack-usage -fcallgraph-info=su" pio run -e gh_release_x4pro -e gh_release_sticky -e simulator_x4_pro

      # v1.0.0 shipped a render task that needed 8016 bytes of an 8192-byte
      # stack and crashed on the first device that ever ran it. Nothing here
      # measured stack, and nothing on a host could: frame sizes belong to the
      # target ABI. This reads the numbers the firmware compiler just emitted.
      #
      # Both checks now read build directories that nothing between them
      # removes. stack_budget.py refuses rather than passing empty -- it exits
      # on no frames and fails a task whose entry is missing -- so the old
      # arrangement would have gone red rather than quiet. That is why this is
      # a fragility fix and not a bug fix.
      - name: Stack fits its task (x4pro)
        run: python3 scripts_local/stack_budget.py --build-dir .pio/build/gh_release_x4pro

      # The Sticky compiles SDK code the x4pro build never sees (mic, buzzer,
      # sensors, IMU) and carries its own device flag, so a green x4pro build
      # does not prove the sticky env compiles. Same stack discipline, same
      # reasons.
      - name: Stack fits its task (sticky)
        run: python3 scripts_local/stack_budget.py --build-dir .pio/build/gh_release_sticky

      # Nothing is forgiven. ui:paperOnTheBand was a real baseline failure
      # once, and this step carried a carefully shaped exemption for it until
      # 2026-08-14 -- four days after the failure was fixed. In that window a
      # regression in exactly that test would have passed CI with a warning
      # while a local check.sh went red: the inverse of the CI-GCC gap this
      # repo already got burned by. A forgiven suite that no longer fails is a
      # door held open for the next regression.
      #
      # host-tests/docsclaims asks who wrote each file in docs/ by comparing it
      # against upstream, and actions/checkout gives the runner only `origin`.
      # Without this the whole ownership half of that suite SKIPPED here while
      # docs/README.md told readers it was enforced -- most of its checks
      # running nowhere that blocks a merge. A shallow fetch is enough: the
      # suite only reads blobs at the tip. Deliberately not `|| true`; a silent
      # skip is the exact failure being fixed, and docsclaims fails outright in
      # CI when the ref is missing.
      - name: Fetch upstream's tip, for the docs ownership checks
        run: |
          git fetch --no-tags --depth=1 \
            https://github.com/crosspoint-reader/crosspoint-reader.git \
            develop:refs/remotes/crosspoint/develop
          git rev-parse --verify crosspoint/develop

      # host-tests/ci/run.sh executes this step's actual text (extracted from
      # this yaml, not copied) and asserts the no-forgiveness shape, so drift
      # here fails a suite there.
      - name: Host tests
        run: |
          for suite in host-tests/*/run.sh; do
            # relwatch has its own job. It runs a real postgres in docker, and
            # sharing a runner with a 20-minute cross-compile starved it: the
            # container's own log showed it had not begun INITIALISING seven
            # minutes after `docker run` returned. Raising the timeout twice
            # and pre-pulling the image both failed, because neither was the
            # problem -- contention was. It has failed four unrelated pull
            # requests this way; see the relwatch job below.
            case "$suite" in */relwatch/*) continue;; esac
            bash "$suite"
          done

  # relwatch runs a real postgres in docker, and it gets its OWN runner.
  #
  # It shared the build job until 2026-09-04, where it failed four pull
  # requests whose diffs could not touch a database -- a Forehead word list, a
  # worktree script, a trivia pack and a docs change. Two timeout bumps (60 ->
  # 180 -> 420) and a pre-pull of the image all failed, because none of them
  # was the problem: the container's own log showed it had not begun
  # INITIALISING seven minutes after `docker run` returned, with the image
  # already local. A 20-minute cross-compile was starving it of IO.
  #
  # Alone on a runner it has the machine to itself. This also fails
  # independently, so a database that will not start no longer hides whether
  # the firmware compiles.
  relwatch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pull the database image
        run: docker pull postgres:16-alpine
      - name: The release watcher's suite
        run: bash host-tests/relwatch/run.sh

  # The `release-notes-line` job lived here and is gone with the release
  # workflow it policed. It failed a pull request that changed
  # .github/workflows/crossplay-release.yml without writing a "What is new:"
  # line, because merging such a change cut a release that could not describe
  # itself -- PR #42 repaired the defect that shipped v1.12.14 and v1.12.15
  # without a bootloader, and somebody whose install was broken needed telling.
  #
  # The need did not go away, it moved: scripts_local/release_notes.py still
  # decides which landings earn a line, and ship.sh will not publish without
  # a body. What is gone is the pull_request trigger it needed, so keeping the
  # job would have left a check that can never run guarding a file that no
  # longer exists.

  clang-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install clang-format-21
        run: |
          wget -q https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 21
          sudo apt-get update
          sudo apt-get install -y clang-format-21

      - name: Every file is formatted
        run: |
          PATH="/usr/lib/llvm-21/bin:$PATH" ./bin/clang-format-fix
          git diff --exit-code || (echo "Run bin/clang-format-fix with clang-format 21 and commit the result" && exit 1)

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build

      - name: Cache googletest source
        uses: actions/cache@v4
        with:
          path: build/test/_deps/googletest-src
          key: ${{ runner.os }}-googletest-${{ hashFiles('test/CMakeLists.txt') }}

      - name: Configure
        run: cmake -S test -B build/test -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build/test

      - name: Run tests
        run: ctest --test-dir build/test --output-on-failure -j

  # High severity blocks: that is the class that names a real bug (a reference
  # to a temporary, in the one finding the fork had). The medium and low
  # findings (18 and 374 on 2026-09-04) are card #136's backlog; this job's log
  # lists them on every run, so the number is never a guess.
  cppcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      - name: Install PlatformIO Core
        run: uv pip install --system -U https://github.com/pioarduino/platformio-core/archive/refs/tags/v6.1.19.zip

      - name: Cache PlatformIO packages
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
          restore-keys: pio-${{ runner.os }}-

      # PlatformIO's tool-cppcheck binary links against libpcre3, which the
      # ubuntu-latest runner stopped shipping; without it `pio check` reports
      # "Failed to execute check command! Exited with code 127" for every
      # file, which reads like a broken analysis and is a missing library.
      # Upstream's ci.yml carries the same step for the same reason.
      - name: Install cppcheck runtime dependency
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libpcre3

      - name: cppcheck, high severity blocks
        run: pio check --fail-on-defect high
