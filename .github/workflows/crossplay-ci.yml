# CrossPlay's own CI.
#
# Upstream's ci.yml only fires on pushes to `master`, which this fork does not
# have, so without this the default branch had no checks at all and the repo
# front page said nothing about whether HEAD compiles. It has been wrong before:
# `xteink` once did not build for three commits because every local check.sh ran
# against a dirty tree.
#
# It builds the firmware and the simulator and runs the host suites. Since
# 2026-09-04 it also carries clang-format, the cmake unit tests and cppcheck:
# those were upstream's ci.yml's jobs, which ran on every pull request until
# that workflow was disabled (red on the fork's own code for a week, and read
# by nobody). Its four device builds duplicated the one below, so the workflow
# stays off and the three jobs the fork had nowhere else live here.
name: CrossPlay

on:
  push:
    branches: [xteink]
    # CI's OWN emulator rebuild is not a change to test, and running it costs
    # a whole release cycle. After every merge, crossplay-emulator.yml commits
    # site/emulator/{BUILT_FROM,crossplay.js,crossplay.wasm} back to xteink --
    # three files, no byte of which reaches a device. That push started a
    # SECOND CrossPlay run which cancelled the merge's own run, so every merge
    # cost two full builds and the first was always thrown away. Seen
    # 2026-09-04: merge 52b2a677 at 17:02:13, emulator commit eb79a542 at
    # 17:07:20, the 17:02 run cancelled five minutes in, and the autorelease
    # that fired at 17:07:23 skipped because a cancelled run is not a success.
    #
    # crossplay-autorelease.yml already assumed this could not happen -- its
    # comment reads "pushed with the workflow token, so no CI run ever comes
    # for it" -- and built the right behaviour on that assumption: a tip that
    # moved only by emulator rebuilds releases from the tip. The assumption
    # stopped being true; this restores it explicitly rather than by relying
    # on a token's side effect.
    paths-ignore:
      - 'site/emulator/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# One run per branch at a time. A push on top of a pull request supersedes
# the run for the commit it replaced; five runs of one branch were once
# sharing the runners while a merge waited on its own build.
#
# Not on xteink, and this is the whole reason for the expression below.
# Superseding was meant to fold two quick merges into one run that releases
# them together, which works when a run survives to the end. It does not
# survive a STREAM of merges: on the night of 2026-09-03 they landed at
# 22:58, 23:05, 23:42, 23:47 (three), 23:56, 00:16 and 00:29 -- every 13 to
# 20 minutes, and this build takes longer than that. Each merge cancelled the
# previous merge's run, three in a row reached no conclusion at all, and
# crossplay-autorelease.yml fires on `workflow_run` with conclusion success.
# A cancelled run is not a success, so nothing released for six merges while
# RELEASE_HOLD was 0 and nobody was holding anything. Every individual
# cancellation looked exactly like this rule working correctly.
#
# So pull requests still supersede, and xteink queues. crossplay-emulator.yml
# already does the second thing (cancel-in-progress: false), which is why its
# run for 2b9f3a84 finished while this workflow's run for the same commit was
# cancelled -- the same merge, the two rules, two outcomes.
concurrency:
  group: crossplay-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/xteink' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          # Tags, or host-tests/release cannot compare this release's notes
          # against what the previous tag published -- it SKIPS instead, which
          # is exactly the check silently not running in the only place that
          # would have caught v1.6.2 shipping v1.6.1's text.
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      - name: Install PlatformIO Core
        run: uv pip install --system -U https://github.com/pioarduino/platformio-core/archive/refs/tags/v6.1.19.zip

      - name: Cache PlatformIO packages
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}

      # The simulator links against SDL2, and on Linux its MD5Builder is a thin
      # wrapper over OpenSSL (CommonCrypto on macOS). The firmware needs
      # neither. Both are usually present on the runner; naming them here is
      # what stops a runner image change from looking like our bug.
      - name: Install the simulator's host libraries
        run: sudo apt-get update && sudo apt-get install -y libsdl2-dev libssl-dev

      # ONE BUILD STEP. Five envs in five invocations became three in one.
      #
      # CI used to build x4pro and sticky (dev) as well. Their only extra code
      # is CROSSPOINT_DEV_SERIAL_BRIDGE, and a break in it costs the next
      # person who wants to drive a device over the cable -- never a user. That
      # is a real cost but a deferred one, and it is not worth paying on every
      # pull request when a plain local check.sh still builds both.
      #
      # ONE invocation for all three, and that is not an optimisation. `pio run`
      # calls clean_build_dir() once per INVOCATION against the whole
      # .pio/build root, and wipes it when compute_project_checksum() differs.
      # This project's pre-scripts write gitignored headers into src/ and lib/
      # as the build runs, so on a fresh checkout invocation #2 opens by
      # deleting invocation #1's output. That is what broke v1.12.14 and
      # v1.12.15. One invocation, one checksum, nothing to delete.
      #
      # The flags only add .su and .ci files beside the objects; they change no
      # code, so this is still the build the checks below read. Measuring the
      # RELEASE images rather than the dev ones is also strictly better: it is
      # the stack of the binary a user actually runs.
      - name: Build everything
        run: PLATFORMIO_BUILD_FLAGS="-fstack-usage -fcallgraph-info=su" pio run -e gh_release_x4pro -e gh_release_sticky -e simulator_x4_pro

      # v1.0.0 shipped a render task that needed 8016 bytes of an 8192-byte
      # stack and crashed on the first device that ever ran it. Nothing here
      # measured stack, and nothing on a host could: frame sizes belong to the
      # target ABI. This reads the numbers the firmware compiler just emitted.
      #
      # Both checks now read build directories that nothing between them
      # removes. stack_budget.py refuses rather than passing empty -- it exits
      # on no frames and fails a task whose entry is missing -- so the old
      # arrangement would have gone red rather than quiet. That is why this is
      # a fragility fix and not a bug fix.
      - name: Stack fits its task (x4pro)
        run: python3 scripts_local/stack_budget.py --build-dir .pio/build/gh_release_x4pro

      # The Sticky compiles SDK code the x4pro build never sees (mic, buzzer,
      # sensors, IMU) and carries its own device flag, so a green x4pro build
      # does not prove the sticky env compiles. Same stack discipline, same
      # reasons.
      - name: Stack fits its task (sticky)
        run: python3 scripts_local/stack_budget.py --build-dir .pio/build/gh_release_sticky

      # Nothing is forgiven. ui:paperOnTheBand was a real baseline failure
      # once, and this step carried a carefully shaped exemption for it until
      # 2026-08-14 -- four days after the failure was fixed. In that window a
      # regression in exactly that test would have passed CI with a warning
      # while a local check.sh went red: the inverse of the CI-GCC gap this
      # repo already got burned by. A forgiven suite that no longer fails is a
      # door held open for the next regression.
      #
      # Pull postgres BEFORE the firmware build, not when the suite wants it.
      #
      # host-tests/relwatch runs a real postgres in docker. Twice today it
      # failed a pull request whose diff could not touch a database, and the
      # diagnostic showed why: the container was still running its
      # INITIALISATION when the suite gave up, i.e. it had started late. The
      # image pull competes with a firmware build for the same runner IO.
      #
      # Pulling here costs seconds on a warm runner and removes the race
      # entirely: by the time the suite runs, the image is local and the
      # container only has to start. `|| true` because a pull failure must not
      # fail the build -- the suite still pulls on demand and reports properly
      # if that fails.
      - name: Pre-pull the relwatch database image
        run: docker pull postgres:16-alpine || true

      # host-tests/ci/run.sh executes this step's actual text (extracted from
      # this yaml, not copied) and asserts the no-forgiveness shape, so drift
      # here fails a suite there.
      - name: Host tests
        run: |
          for suite in host-tests/*/run.sh; do
            bash "$suite"
          done

  # check.sh runs the same formatter check (clang-format 21, pinned there too)
  # and the same cmake suite locally; CI is the copy nobody can skip.
  clang-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install clang-format-21
        run: |
          wget -q https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 21
          sudo apt-get update
          sudo apt-get install -y clang-format-21

      - name: Every file is formatted
        run: |
          PATH="/usr/lib/llvm-21/bin:$PATH" ./bin/clang-format-fix
          git diff --exit-code || (echo "Run bin/clang-format-fix with clang-format 21 and commit the result" && exit 1)

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build

      - name: Cache googletest source
        uses: actions/cache@v4
        with:
          path: build/test/_deps/googletest-src
          key: ${{ runner.os }}-googletest-${{ hashFiles('test/CMakeLists.txt') }}

      - name: Configure
        run: cmake -S test -B build/test -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build/test

      - name: Run tests
        run: ctest --test-dir build/test --output-on-failure -j

  # High severity blocks: that is the class that names a real bug (a reference
  # to a temporary, in the one finding the fork had). The medium and low
  # findings (18 and 374 on 2026-09-04) are card #136's backlog; this job's log
  # lists them on every run, so the number is never a guess.
  cppcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      - name: Install PlatformIO Core
        run: uv pip install --system -U https://github.com/pioarduino/platformio-core/archive/refs/tags/v6.1.19.zip

      - name: Cache PlatformIO packages
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}

      - name: cppcheck, high severity blocks
        run: pio check --fail-on-defect high
