name: CrossPlay board

# A merged pull request closes its card. Until 2026-09-20 that was somebody's
# memory: the worker set `review`, the orchestrator set `merged`, and nothing
# ever moved a card past that unless a person remembered to. 24 cards sat
# open with their pull request merged, some for two weeks, inside a pile of
# 203. The board's events trigger (20260920000100_board_rethink.sql) closes
# every card bound to the branch this posts; this workflow is the post.
#
# The address and the public key are repository variables, the same two the
# release workflow uses; without them the step is skipped. A pull request
# from a fork has a branch no card is bound to, so its event closes nothing.
on:
  pull_request:
    types: [closed]

permissions: {}

jobs:
  merged:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Tell the board the pull request merged
        if: vars.SUPABASE_URL != '' && vars.SUPABASE_ANON_KEY != ''
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          body="$(python3 -c 'import json,os; print(json.dumps({"service":"workflow","event":"merged","props":{"branch":os.environ["BRANCH"],"pr":os.environ["PR"],"sha":os.environ["SHA"]}}))')"
          curl -sS -o /dev/null -w "events: %{http_code}\n" -X POST "$SUPABASE_URL/rest/v1/events" \
            -H "apikey: $SUPABASE_ANON_KEY" -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            -H "Content-Type: application/json" -H "Prefer: return=minimal" \
            -d "$body" || true
