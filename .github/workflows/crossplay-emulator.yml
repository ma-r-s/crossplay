# Rebuild the browser emulator after a merge, and commit it.
#
# site/emulator/ is a committed build artefact, and both sides of every merge
# used to conflict on it, which is the whole reason the integration tree
# needed a single occupant. This job does that rebuild on GitHub after every
# push to xteink whose sources are newer than the artefact
# (scripts_local/emulator-stale.sh, the same test check.sh applies), and
# commits the result as "chore: emulator rebuilt for <sha>".
#
# The commit is pushed with the workflow's own token, so it starts no CI run
# of its own: it changes nothing a device build sees, and the next real merge's
# CI covers it. One at a time, rebased before push, so two quick merges make
# two commits in order rather than a conflict.
name: CrossPlay emulator

on:
  push:
    branches: [xteink]
    paths:
      - "src/**"
      - "lib/**"
      - "assets_local/**"
      - "tools_local/wasm/**"
      - "platformio.sim.ini"
      - "freeink-sdk"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: crossplay-emulator
  cancel-in-progress: false

env:
  EMSDK_VERSION: "6.0.6"

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: xteink
          fetch-depth: 0
          submodules: recursive
          token: ${{ secrets.RELEASE_TOKEN || github.token }}

      # emulator-stale.sh answers THREE ways: 0 stale, 1 fresh, 2 it could not
      # look (its cd failed). An `if` keeps only "was it zero", so 2 landed in
      # the else branch and was recorded as stale=false. Every later step is
      # gated on `stale == 'true'`, so all of them were skipped and the job
      # reported success having rebuilt nothing -- the one outcome that looks
      # exactly like "the emulator was already fresh". Capture the code and
      # fail on anything that is not one of the two real answers.
      - name: Is the emulator behind its sources?
        id: stale
        run: |
          set +e
          bash scripts_local/emulator-stale.sh .
          rc=$?
          set -e
          case "$rc" in
            0) echo "stale=true"  >> "$GITHUB_OUTPUT" ;;
            1) echo "stale=false" >> "$GITHUB_OUTPUT" ;;
            *) echo "::error::emulator-stale.sh could not answer (exit $rc); the emulator was not checked, so it was not rebuilt"
               exit 1 ;;
          esac

      - uses: actions/setup-python@v5
        if: steps.stale.outputs.stale == 'true'
        with:
          python-version: "3.12"

      - name: Install PlatformIO and the simulator's host libraries
        if: steps.stale.outputs.stale == 'true'
        run: |
          pip install --upgrade pip
          pip install -U https://github.com/pioarduino/platformio-core/archive/refs/tags/v6.1.19.zip brotli
          sudo apt-get update && sudo apt-get install -y libsdl2-dev libssl-dev

      - name: Cache PlatformIO packages
        if: steps.stale.outputs.stale == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-emulator-${{ runner.os }}-${{ hashFiles('platformio.ini', 'platformio.sim.ini') }}

      - name: Cache emscripten
        if: steps.stale.outputs.stale == 'true'
        id: emsdk-cache
        uses: actions/cache@v4
        with:
          path: ~/emsdk
          key: emsdk-${{ env.EMSDK_VERSION }}-${{ runner.os }}

      - name: Install emscripten
        if: steps.stale.outputs.stale == 'true' && steps.emsdk-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git ~/emsdk
          ~/emsdk/emsdk install "$EMSDK_VERSION"
          ~/emsdk/emsdk activate "$EMSDK_VERSION"

      - name: Build the emulator
        if: steps.stale.outputs.stale == 'true'
        run: |
          pio run -e simulator_x4_pro -t compiledb
          source ~/emsdk/emsdk_env.sh
          python3 tools_local/wasm/build.py
          git status --short site/emulator

      - name: Commit and push the artefact
        if: steps.stale.outputs.stale == 'true'
        run: |
          git config user.name "crossplay-release[bot]"
          git config user.email "crossplay-release@users.noreply.github.com"
          git add site/emulator
          if git diff --cached --quiet; then
            echo "The rebuild produced identical bytes; nothing to commit."
            exit 0
          fi
          git commit -m "chore: emulator rebuilt for $(git rev-parse --short HEAD)" -m "Rebuilt by crossplay-emulator.yml after a push to xteink."
          git pull --rebase origin xteink
          git push origin HEAD:xteink
