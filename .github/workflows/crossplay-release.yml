# Turn a v* tag into a release the device's own updater can install.
#
# Upstream's release.yml is still in this tree and still fires on every tag, but
# it builds gh_release, which is -DFREEINK_DEVICE_X4/X3 and therefore ESP32-C3.
# The X4 Pro is an S3. Two workflows on one tag would publish two binaries and
# let the updater pick the wrong chip, so upstream's is filtered to tags this
# fork never creates (see the `if` below) and this one owns v*.
name: CrossPlay release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: pio-release-${{ hashFiles('platformio.ini') }}

      - name: Install PlatformIO
        run: pip install --upgrade platformio

      - name: Build
        run: pio run -e gh_release_x4pro

      # Two .bin files, because the two ways of installing this need different
      # images and shipping only one of them is what went wrong before.
      #
      #   -full.bin  bootloader + partition table + app, flashed at 0x0 over
      #              USB. This is the one a first install needs. v1.0.0 and
      #              v1.0.1 shipped the app on its own and told people to write
      #              it to 0x0 -- which on an S3 is where the bootloader lives,
      #              so it landed on top of it.
      #   firmware.bin  the app alone. The over-the-air updater matches this
      #              name exactly (lib/JsonParser/ReleaseJsonParser.cpp:47) and
      #              the SD-card updater looks for the same name on the card.
      #              Named for the device in the release title, not the file:
      #              renaming it is what silently switched both updaters off.
      #
      # -fm/-fs/-ff keep: the flash mode, size and frequency already in the
      # bootloader header are the ones this build was configured with. Passing
      # them again by hand is a second copy of a fact that can drift; verified
      # byte-identical to spelling them out.
      - name: Name the artefacts
        run: |
          mkdir -p dist
          pip install --upgrade esptool
          python -m esptool --chip esp32s3 merge-bin --format raw \
            -o "dist/crossplay-${GITHUB_REF_NAME}-x4pro-full.bin" \
            -fm keep -fs keep -ff keep \
            0x0     .pio/build/gh_release_x4pro/bootloader.bin \
            0x8000  .pio/build/gh_release_x4pro/partitions.bin \
            0x10000 .pio/build/gh_release_x4pro/firmware.bin
          cp .pio/build/gh_release_x4pro/firmware.bin dist/firmware.bin
          cp .pio/build/gh_release_x4pro/firmware.elf \
             "dist/crossplay-${GITHUB_REF_NAME}-x4pro.elf"
          ls -la dist

      # A merged image that is not actually merged is indistinguishable from
      # the app image it replaces until someone bricks a device with it, so
      # check the three magic numbers rather than trust the exit code.
      - name: The merged image really is merged
        run: |
          full="dist/crossplay-${GITHUB_REF_NAME}-x4pro-full.bin"
          fail=0
          check() {  # offset, expected-magic, what
            got=$(dd if="$full" bs=1 skip=$1 count=2 2>/dev/null | xxd -p)
            if [ "$got" != "$2" ]; then
              echo "::error::$full at $(printf '0x%x' $1): expected $2 ($3), got $got"
              fail=1
            else
              echo "  $(printf '0x%-7x' $1) $got  $3"
            fi
          }
          check 0     e903 "bootloader"
          check 32768 aa50 "partition table"
          check 65536 e907 "app"
          exit $fail

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          # Off on purpose. This fork carries upstream's whole history, and with
          # no previous tag of its own the generator has no floor: v1.0.0 would
          # have listed 1,319 commits, most of them CrossPoint's, as "what is
          # new in CrossPlay". A release note is a thing you write.
          generate_release_notes: false
          body: |
            Games and small tools for the **Xteink X4 Pro**, on top of
            [CrossPoint](https://crosspointreader.com/). Chess, Battleship,
            Connections, Solitaire, D&Diagrams, Insider, Jaipur and Murdle,
            plus spaced-repetition flashcards, Hacker News and the xkcd
            archive. Chess, Battleship and Jaipur play over **PLAY NEARBY**:
            two devices next to each other find one another with nothing to
            type.

            Try the whole thing in a browser first, without owning one:
            **[crossplay.ma-r-s.com](https://crossplay.ma-r-s.com)** runs this
            same firmware compiled to WebAssembly.

            ### Before you flash this

            **No one has run this build on a physical device.** It is developed
            against a simulator and a browser build of the same sources, and the
            author does not have an X4 Pro. The host test suites pass and both
            firmware targets compile, but "compiles and passes tests" is not
            "known to boot". You are the hardware test. If it does not work,
            please [open an issue](https://github.com/ma-r-s/crossplay/issues)
            and say what happened.

            **The X4 Pro only.** The X4 and X3 are ESP32-C3; this is an S3.
            Flashing it there is a cross-chip flash. Install
            [CrossPoint](https://crosspointreader.com/) on those instead.

            **Flashing replaces the firmware, not the SD card.** Your library,
            your reading positions and your fonts are files on that card and are
            left alone. Installing stock CrossPoint over the top puts the device
            back where it was, which is what makes this cheap to try. If a flash
            goes wrong,
            [docs/fix-bricked-xteink.md](https://github.com/ma-r-s/crossplay/blob/xteink/docs/fix-bricked-xteink.md)
            is the way back.

            Install steps, including the `esptool` route if you would rather not
            trust a web page with your serial port, are in the
            [README](https://github.com/ma-r-s/crossplay#install-it).
