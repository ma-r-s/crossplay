# Turn a v* tag into a release the devices' own updaters can install.
#
# Upstream's release.yml is still in this tree and still fires on every tag, but
# it builds gh_release, which is -DFREEINK_DEVICE_X4/X3 and therefore ESP32-C3.
# This fork's devices (X4 Pro, Sticky) are S3. Two workflows on one tag would
# publish two binaries and let the updater pick the wrong chip, so upstream's is
# filtered to tags this fork never creates (see the `if` below) and this one
# owns v*.
#
# One release carries one app image per device. Their names are contracts:
# the x4pro fleet's updater asks for the literal "firmware.bin" (every unit in
# the field since v1.0.0), and each later board asks for its per-board suffix
# (firmware-sticky.bin). CROSSPOINT_RELEASE_ASSET in src/network/
# FirmwareBoardTag.h encodes both rules; host-tests/release asserts this file
# publishes what the devices ask for. Cross-flashing is guarded twice: the
# esp_image chip_id check, and the CROSSPOINT-BOARD-V1 tag embedded in every
# image (both updaters abort on a tag naming a different board).
name: CrossPlay release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          # Tags, for host-tests/release below: without them its notes gate
          # cannot see what the previous tag published and skips itself.
          fetch-depth: 0

      # The tag and the version are two hand-edited facts that nothing forced to
      # agree. A v1.6.4 tag pushed with platformio.ini still at 1.6.3 builds an
      # image reporting the old version, publishes it under the new one, and
      # every notes gate stays green because it reads the file, not the tag.
      # First step, so it costs seconds rather than a full build.
      - name: The tag must be the version being built
        run: |
          VERSION=$(awk '/^\[crossplay\]/{f=1;next} /^\[/{f=0} f && /^version *=/{print $3; exit}' platformio.ini)
          if [ "${GITHUB_REF_NAME}" != "v${VERSION}" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match [crossplay] version ${VERSION}" >&2
            exit 1
          fi
          echo "tag ${GITHUB_REF_NAME} matches [crossplay] version ${VERSION}"

      # The notes gate runs HERE, not only in CI. CI is a different workflow on
      # a different trigger with no `needs:` binding it to this one, so pushing
      # the branch and the tag together published the release first and went red
      # afterwards -- which changes nothing already public. This is the last
      # moment stale notes can still be stopped.
      - name: The release notes must be this release's
        run: bash host-tests/release/run.sh

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: pio-release-${{ hashFiles('platformio.ini') }}

      - name: Install PlatformIO
        run: pip install --upgrade platformio

      - name: Build x4pro
        run: pio run -e gh_release_x4pro

      - name: Build sticky
        run: pio run -e gh_release_sticky

      # Two .bin files per device, because the two ways of installing need
      # different images and shipping only one of them is what went wrong
      # before.
      #
      #   -full.bin  bootloader + partition table + app, flashed at 0x0 over
      #              USB. This is the one a first install needs. v1.0.0 and
      #              v1.0.1 shipped the app on its own and told people to write
      #              it to 0x0 -- which on an S3 is where the bootloader lives,
      #              so it landed on top of it.
      #   firmware.bin / firmware-sticky.bin  the app alone, one per device.
      #              The over-the-air updater matches its own device's name
      #              exactly (CROSSPOINT_RELEASE_ASSET); renaming one is what
      #              silently switched both updaters off in v1.0.x.
      #
      # The per-board steps are spelled out rather than looped so
      # host-tests/release can assert offsets and filenames against literal
      # text.
      #
      # -fm/-fs/-ff keep: the flash mode, size and frequency already in the
      # bootloader header are the ones this build was configured with. Passing
      # them again by hand is a second copy of a fact that can drift; verified
      # byte-identical to spelling them out.
      - name: Name the x4pro artefacts
        run: |
          mkdir -p dist
          pip install --upgrade esptool
          python -m esptool --chip esp32s3 merge-bin --format raw \
            -o "dist/crossplay-${GITHUB_REF_NAME}-x4pro-full.bin" \
            -fm keep -fs keep -ff keep \
            0x0     .pio/build/gh_release_x4pro/bootloader.bin \
            0x8000  .pio/build/gh_release_x4pro/partitions.bin \
            0x10000 .pio/build/gh_release_x4pro/firmware.bin
          cp .pio/build/gh_release_x4pro/firmware.bin dist/firmware.bin
          cp .pio/build/gh_release_x4pro/firmware.elf \
             "dist/crossplay-${GITHUB_REF_NAME}-x4pro.elf"

      - name: Name the sticky artefacts
        run: |
          python -m esptool --chip esp32s3 merge-bin --format raw \
            -o "dist/crossplay-${GITHUB_REF_NAME}-sticky-full.bin" \
            -fm keep -fs keep -ff keep \
            0x0     .pio/build/gh_release_sticky/bootloader.bin \
            0x8000  .pio/build/gh_release_sticky/partitions.bin \
            0x10000 .pio/build/gh_release_sticky/firmware.bin
          cp .pio/build/gh_release_sticky/firmware.bin dist/firmware-sticky.bin
          cp .pio/build/gh_release_sticky/firmware.elf \
             "dist/crossplay-${GITHUB_REF_NAME}-sticky.elf"
          ls -la dist

      # A merged image that is not actually merged is indistinguishable from
      # the app image it replaces until someone bricks a device with it, so
      # check the three magic numbers rather than trust the exit code.
      - name: The merged images really are merged
        run: |
          fail=0
          for full in "dist/crossplay-${GITHUB_REF_NAME}-x4pro-full.bin" \
                      "dist/crossplay-${GITHUB_REF_NAME}-sticky-full.bin"; do
            check() {  # offset, expected-magic, what
              got=$(dd if="$full" bs=1 skip=$1 count=2 2>/dev/null | xxd -p)
              if [ "$got" != "$2" ]; then
                echo "::error::$full at $(printf '0x%x' $1): expected $2 ($3), got $got"
                fail=1
              else
                echo "  $(printf '0x%-7x' $1) $got  $3  ($full)"
              fi
            }
            check 0     e903 "bootloader"
            check 32768 aa50 "partition table"
            check 65536 e907 "app"
          done
          exit $fail

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          # Off on purpose. This fork carries upstream's whole history, and with
          # no previous tag of its own the generator has no floor: v1.0.0 would
          # have listed 1,319 commits, most of them CrossPoint's, as "what is
          # new in CrossPlay". A release note is a thing you write.
          generate_release_notes: false
          body: |
            Games and small tools for the **Xteink X4 Pro** and the **Seeed
            reTerminal Sticky**, on top of
            [CrossPoint](https://crosspointreader.com/). Seventeen games --
            Chess, Checkers, Connect Four, Yahtzee, Knucklebones, Minesweeper,
            Sudoku, Toy Battle, Forehead, Battleship, Connections, Solitaire,
            D&Diagrams, Insider, Jaipur, Murdle and Sea Salt & Paper -- plus
            spaced-repetition flashcards, Hacker News, the xkcd archive and a
            catalog browser for downloading books. Nine of them play over
            **PLAY NEARBY**: Chess, Checkers, Connect Four, Yahtzee,
            Knucklebones, Battleship, Jaipur, Sea Salt and Toy Battle. Two
            devices next to each other find one another with nothing to type --
            and they do not have to be the same device.

            ### What is new in 1.11.1

            **A fix for a mirrored, unresponsive display on some X4 Pro units.**
            Four people reported it: the screen comes up flipped along the
            horizontal axis and the device answers almost no input. Flashing
            again did not help, because nothing about the flash was wrong.

            The cause was this fork's freeink-sdk pin, which sat 69 commits
            behind upstream on a branch of its own. The upstream work it was
            missing includes an X4 Pro display driver update, e-ink
            initialisation and ghosting improvements, and the touch mirroring
            fixes. The pin now tracks upstream main.

            **This one ships without having been witnessed, on purpose, and that
            is worth saying plainly.** It does not reproduce on the desk unit.
            An X4 Pro selects one of SSD1677, UC8179 or UC8279 at boot, the desk
            unit selects a variant that never showed the fault, and the
            simulator does not reproduce it either. So the fix is the upstream
            driver update for the variants that do fail, reasoned rather than
            observed. A reporter confirming on their own hardware is the
            verification step, not a formality, and
            [#6](https://github.com/ma-r-s/crossplay/issues/6) stays open until
            one does.

            **If your display is mirrored, install over USB rather than from the
            device.** A flipped screen cannot drive the on-device updater.

            ### The short way: press Install

            **[crossplay.ma-r-s.com/#get](https://crossplay.ma-r-s.com/#get)**
            installs this release for you. Open it in Chrome or Edge on a
            computer, plug the device in, wake it, and press Install: the page
            downloads the right image and writes it over USB itself, with
            nothing to install first and no command to type. Safari, Firefox and
            every phone have no Web Serial, and the page says so rather than
            failing when pressed.

            The files below are for doing it by hand, and for the on-device
            updater.

            ### Which file to download

            Each device has its own pair of images; the board name is in the
            filename, and the firmware refuses an image built for the other
            board.

            **`crossplay-<version>-x4pro-full.bin`** /
            **`crossplay-<version>-sticky-full.bin`** are the ones to flash
            over USB. Each is the whole firmware -- bootloader, partition table
            and application in one image -- so it installs on a device that has
            never run CrossPoint.

            **`firmware.bin`** (X4 Pro) and **`firmware-sticky.bin`** (Sticky)
            are the application alone, for a device that is already running
            this. Settings -> Check for updates fetches the right one over
            Wi-Fi, or you can copy it to the SD card and pick it there. Keep
            the filenames: each updater matches its own name exactly.

            v1.0.0 and v1.0.1 published only the application image and told you
            to write it to `0x0`, which on an ESP32-S3 is where the bootloader
            lives. Do not follow the install steps from those two releases.

            Try the whole thing in a browser first, without owning either:
            **[crossplay.ma-r-s.com](https://crossplay.ma-r-s.com)** runs this
            same firmware compiled to WebAssembly.

            ### Before you flash this

            Releases are flashed and booted on the author's own X4 Pro and
            Sticky before they ship. PLAY NEARBY between two Stickys is
            untested -- one Sticky exists here, and two-device play needs two.

            **The X4 and X3 are ESP32-C3**; these images are S3. Flashing them
            there is a cross-chip flash. Install
            [CrossPoint](https://crosspointreader.com/) on those instead.

            **Flashing replaces the firmware, not the SD card.** Your library,
            your reading positions and your fonts are files on that card and are
            left alone. Installing stock CrossPoint over the top puts the device
            back where it was, which is what makes this cheap to try. If a flash
            goes wrong,
            [docs/fix-bricked-xteink.md](https://github.com/ma-r-s/crossplay/blob/xteink/docs/fix-bricked-xteink.md)
            is the way back.

            Full install steps are in the
            [README](https://github.com/ma-r-s/crossplay#install-it). The short
            version, once `pip install esptool` has run -- pick your device's
            file:

            ```
            esptool.py --chip esp32s3 --baud 921600 write_flash 0x0 crossplay-<version>-x4pro-full.bin
            esptool.py --chip esp32s3 --baud 921600 write_flash 0x0 crossplay-<version>-sticky-full.bin
            ```
