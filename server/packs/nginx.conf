# The pack host's one server. Public bytes with Range support, CORS for the
# install page (which lives on another origin), and cache headers Cloudflare
# can honour: a shard is cached for a day, the manifest never, so a new pack
# under the same path is seen within the day and its shards are verified by
# the sha256 the manifest carries.
map $uri $pack_cache {
    default            "public, max-age=86400";
    ~manifest\.json$   "no-cache";
}

server {
    listen 8080;
    server_name _;
    root /srv/packs;
    autoindex off;
    default_type application/octet-stream;
    sendfile on;
    tcp_nopush on;

    add_header Access-Control-Allow-Origin "*" always;
    add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Range, If-None-Match, If-Modified-Since" always;
    add_header Access-Control-Expose-Headers "Content-Length, Content-Range, Accept-Ranges, ETag" always;
    add_header Cache-Control $pack_cache always;

    if ($request_method = OPTIONS) {
        return 204;
    }

    location = /healthz {
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        try_files $uri =404;
    }
}
