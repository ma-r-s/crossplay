; The fork's simulator environments, merged over platformio.ini via extra_configs.
; Deliberately NOT platformio.local.ini: upstream's .gitignore reserves *.local*
; for personal overrides, and this is not personal -- every checkout needs it to
; run the simulator. Keeps our ignore-rule edits at zero.
; The X4 Pro desktop simulator, from CrossPoint's own crosspoint-simulator.
; sim-stubs/ holds the headers the simulator does not ship yet because it
; tracks develop and this branch is ahead; see docs/crosspoint-migration.md.

[env:simulator]
platform = native
lib_ldf_mode = deep+
; Optional native JPEG/PNG decoder mode:
; - add -DCROSSPOINT_SIM_USE_NATIVE_DECODERS under build_flags
; - uncomment lib_compat_mode = off
; - change lib_ignore to: hal, WebSockets
; - uncomment the PNGdec/JPEGDEC entries under lib_deps
lib_compat_mode = off
; Uncomment when you also add the optional project-side hook below.
; custom_run_simulator_target_owner = project
; Uncomment if host ports 8080/8081 are occupied. WebSocket uses the next port.
; custom_simulator_http_port = 18080
build_src_filter =
  +<*>
  ; Firmware-update code remains non-destructive in the simulator.
  -<network/FirmwareFlasher.cpp>
  -<network/OtaBootSwitch.cpp>
  -<network/OtaUpdater.cpp>
  -<platform/skip_efuse_blk_check.c>
build_flags =
  -std=gnu++2a
  !sdl2-config --cflags --libs
  ; The generated HTML headers hold gzipped bytes in a plain `char[]`, so every
  ; byte above 0x7f narrows wherever `char` is signed. That is x86_64, which is
  ; what CI runs; on Apple Silicon `char` is unsigned and none of them narrow,
  ; which is why this only ever failed away from the machine it was written on.
  ; -Wno-c++11-narrowing is clang's spelling of the flag and GCC ignores it, so
  ; the suppression that was here silently did nothing on Linux. -Wno-narrowing
  ; is understood by both.
  -Wno-narrowing
  -Wno-deprecated-declarations
  -DSIMULATOR
  -DCROSSPOINT_EMULATED=1
  -DCROSSPOINT_SIMULATOR_PROJECT_WEBSERVER
  -DCROSSPOINT_VERSION=\"dev-simulator\"
  -DENABLE_SERIAL_LOG
  -DLOG_LEVEL=2
  -DEINK_DISPLAY_SINGLE_BUFFER_MODE=1
  -DMINIZ_NO_ZLIB_COMPATIBLE_NAMES=1
  -DXML_GE=0
  -DXML_CONTEXT_BYTES=1024
  -DUSE_UTF8_LONG_NAMES=1
  -DPNG_MAX_BUFFERED_PIXELS=16416
  -DDISABLE_FS_H_WARNING=1
  -DDESTRUCTOR_CLOSES_FILE=1
  -Isim-stubs
  -Isrc
  ; -DCROSSPOINT_SIM_USE_NATIVE_DECODERS
  ; -Dmemcpy_P=memcpy ; For native JPEGDEC
lib_ignore = hal, PNGdec, JPEGDEC, WebSockets
extra_scripts =
  pre:scripts_local/sim_catchup.py
  pre:scripts/gen_i18n.py
  pre:scripts/git_branch.py
  pre:scripts/build_html.py
  ; Optional IDE task exposure:
  ; post:.pio/libdeps/$PIOENV/simulator/run_simulator_project.py
lib_deps =
  simulator=https://github.com/crosspoint-reader/crosspoint-simulator
  FreeInkUI=symlink://freeink-sdk/libs/ui/FreeInkUI
  Icons=symlink://freeink-sdk/libs/assets/Icons
  bblanchon/ArduinoJson @ 7.4.2
  ricmoo/QRCode @ ^0.0.1
  ; Native decoder opt-in only:
  ; bitbank2/PNGdec @ 1.1.6
  ; https://github.com/bitbank2/JPEGDEC.git#86282979224c8a32fd51e091ed5a35b0c699a52b

[env:simulator_x3]
extends = env:simulator
build_flags =
  ${env:simulator.build_flags}
  -DSIMULATOR_DEVICE_X3

[env:simulator_x4_pro]
extends = env:simulator
build_flags =
  ${env:simulator.build_flags}
  -DSIMULATOR_DEVICE_X4_PRO
